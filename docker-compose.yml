version: "3.8"

services:
  angular-app:
    image: node:20-alpine
    container_name: angular-dev
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "4200:4200"
    command: >
      sh -c "npm install --legacy-peer-deps &&
             npx ng serve --host 0.0.0.0 --disable-host-check"
    environment:
      - NODE_ENV=development
