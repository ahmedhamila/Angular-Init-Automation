version: "3.8"
services:
  app_setup:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "
        npm install --legacy-peer-deps &&
        if [ -n \"${MODELS_DATA}\" ] && [ -n \"${APP_NAME}\" ]; then
          echo 'Generating Angular files for models...' &&
          chmod +x /app/scripts/generate_angular_files.sh &&
          /app/scripts/generate_angular_files.sh \"${APP_NAME}\" \"${MODELS_DATA}\";
        else
          echo 'No models or app name defined, skipping model generation';
        fi
      "
  
  angular_web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4200:4200"
    env_file:
      - .env
    command: >
      sh -c "
        npm install --legacy-peer-deps &&
        npx ng serve --host 0.0.0.0 --disable-host-check
      "
    depends_on:
      - app_setup