version: "3.8"
services:
  app_setup:
    image: node:20-alpine
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    command: >
      sh -c "
        if [ ! -d 'node_modules' ]; then 
          npm install --legacy-peer-deps;
        fi &&
        if [ '${APP_NAME}' ] && [ '${MODELS_DATA}' ]; then
          mkdir -p scripts &&
          sh /app/scripts/generate_angular_files.sh \"${APP_NAME}\" \"${MODELS_DATA}\";
        fi
      "

  angular-app:
    image: node:20-alpine
    volumes:
      - .:/app
    ports:
      - "4200:4200"
    working_dir: /app
    command: >
      sh -c "
        if [ ! -d 'node_modules' ]; then 
          npm install --legacy-peer-deps;
        fi &&
        npx ng serve --host 0.0.0.0 --disable-host-check
      "
    env_file:
      - .env
    depends_on:
      - app_setup
